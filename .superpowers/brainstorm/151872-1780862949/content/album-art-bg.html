<h2>专辑封面如何融入歌词背景？</h2>
<p class="subtitle">现在是独立的 200x200 卡片，你希望它成为背景氛围的一部分</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>水印叠加</h3>
      <p>专辑封面半透明叠在歌词文字后面，像水印一样若隐若现。文字可读性最高。</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>模糊全幅背景</h3>
      <p>专辑封面拉伸铺满整个中栏，做高斯模糊 + 暗色遮罩。歌词浮在最上面。沉浸感最强。</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>取色氛围</h3>
      <p>从专辑封面提取主色调，用渐变背景动态变化。不显示封面图本身，但背景颜色随歌曲切换而变化。</p>
    </div>
  </div>
</div>
